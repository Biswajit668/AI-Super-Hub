    <script>
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
